<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard - School Queue System</title>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Segoe UI", sans-serif;
        background-color: #f4f6f8;
      }
      .sidebar {
        height: 100vh;
        position: fixed;
        top: 0;
        left: 0;
        width: 220px;
        background-color: #224abe;
        color: white;
        display: flex;
        flex-direction: column;
        padding-top: 2rem;
      }
      .sidebar a {
        color: white;
        padding: 12px 20px;
        text-decoration: none;
        font-weight: 500;
        transition: background 0.2s;
      }
      .sidebar a:hover {
        background-color: rgba(255, 255, 255, 0.1);
        border-radius: 6px;
      }
      .main-content {
        margin-left: 220px;
        padding: 2rem;
      }
      .summary-card {
        border-radius: 12px;
        background: #ffffff;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.06);
        padding: 1.5rem;
        text-align: center;
        transition: transform 0.2s ease;
      }
      .summary-card:hover {
        transform: translateY(-4px);
      }
      .ticket-table th {
        background-color: #f8f9fa;
        text-transform: uppercase;
        font-size: 0.85rem;
      }
      .ticket-table td {
        vertical-align: middle;
      }
      .status-badge {
        font-size: 0.85em;
        padding: 0.4em 0.8em;
        border-radius: 1em;
      }
      .filters-container {
        background: #ffffff;
        padding: 1rem;
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        margin-bottom: 1.5rem;
      }
      .search-input {
        border-radius: 30px;
        padding-left: 40px;
      }
      .search-wrapper {
        position: relative;
      }
      .search-wrapper i {
        position: absolute;
        top: 50%;
        left: 12px;
        transform: translateY(-50%);
        color: #6c757d;
      }
    </style>
  </head>
  <body>
    <!-- Sidebar -->
    <div class="sidebar">
      <h3 class="text-center mb-4">Admin Menu</h3>
      <a href="#" onclick="showDashboard()"
        ><i class="fas fa-tachometer-alt me-2"></i> Dashboard</a
      >
      <a href="#" onclick="showCreateAdmin()"
        ><i class="fas fa-user-shield me-2"></i> Create Admin</a
      >
      <a href="#" onclick="showCreateClerk()">
        <i class="fas fa-user-tie me-2"></i> Create Clerk
      </a>
      <a href="#" onclick="showStudents()"
        ><i class="fas fa-user-graduate me-2"></i> Students</a
      >
      <a href="#" onclick="showReports()">
        <i class="fas fa-chart-line me-2"></i> Reports
      </a>
      <a href="#" onclick="logout()"
        ><i class="fas fa-sign-out-alt me-2"></i> Logout</a
      >
    </div>

    <div class="main-content" id="mainContent">
      <!-- Dashboard content will render here dynamically -->
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.js"></script>
    <script>
      const BASE_URL = "https://school-queue-system-backend.onrender.com";
      let tickets = [];
      let services = [];
      let summary = {};
      let filteredTickets = [];

      document.addEventListener("DOMContentLoaded", () => {
        showDashboard();
      });

      // ====== DASHBOARD VIEW ======
      async function showDashboard() {
        const content = `
      <div class="dashboard-header">
        <div class="container">
          <h1 class="mb-3"><i class="fas fa-user-shield me-2"></i> Admin Dashboard</h1>
        </div>
      </div>
      <div class="row mb-4" id="summaryRow"></div>
      <div class="filters-container">
        <div class="row g-3">
          <div class="col-md-4">
            <select class="form-select" id="filterService" onchange="filterTickets()">
              <option value="">All Services</option>
            </select>
          </div>
          <div class="col-md-4">
            <select class="form-select" id="filterStatus" onchange="filterTickets()">
              <option value="">All Statuses</option>
              <option value="WAITING">Waiting</option>
              <option value="CALLED">Called</option>
              <option value="IN_PROGRESS">In Progress</option>
              <option value="COMPLETED">Completed</option>
              <option value="CANCELLED">Cancelled</option>
            </select>
          </div>
          <div class="col-md-4">
            <div class="search-wrapper">
              <i class="fas fa-search"></i>
              <input type="text" class="form-control search-input" id="filterSearch" placeholder="Search..." oninput="filterTickets()"/>
            </div>
          </div>
        </div>
      </div>
      <div class="card shadow-sm">
        <div class="card-header d-flex justify-content-between align-items-center bg-white">
          <h5 class="mb-0"><i class="fas fa-ticket-alt me-2"></i> All Tickets</h5>
          <button class="btn btn-outline-primary btn-sm rounded-pill" onclick="refreshData()">
            <i class="fas fa-sync-alt"></i> Refresh
          </button>
        </div>
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table ticket-table mb-0 table-hover align-middle">
              <thead>
                <tr>
                  <th>Student</th>
                  <th>Code</th>
                  <th>Service</th>
                  <th>Position</th>
                  <th>Status</th>
                  <th>Created At</th>
                  <th>Called At</th>
                  <th>Completed At</th>
                </tr>
              </thead>
              <tbody id="ticketTableBody">
                <tr><td colspan="9" class="text-center py-4">Loading tickets...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>`;
        document.getElementById("mainContent").innerHTML = content;
        await loadDashboardData();
      }

      async function loadDashboardData() {
        try {
          const [servicesRes, summaryRes, ticketsRes] = await Promise.all([
            fetch(`${BASE_URL}/api/queue/services/detailed`, {
              credentials: "include",
            }),
            fetch(`${BASE_URL}/api/queue/statistics/summary`, {
              credentials: "include",
            }),
            fetch(`${BASE_URL}/api/tickets/all`, {
              credentials: "include",
            }),
          ]);

          const servicesData = await servicesRes.json();
          const summaryData = await summaryRes.json();
          const ticketsData = await ticketsRes.json();

          if (!servicesRes.ok || !servicesData.success) {
            throw new Error(servicesData.message || "Failed to load services");
          }
          if (!ticketsRes.ok || !ticketsData.success) {
            throw new Error(ticketsData.message || "Failed to load tickets");
          }

          services = servicesData.services || [];
          summary = summaryData;
          tickets = ticketsData.tickets || [];

          updateServiceFilter();
          renderSummary();
          filterTickets();
        } catch (e) {
          alert("Failed to load dashboard: " + e.message);
        }
      }

      function renderSummary() {
        const row = document.getElementById("summaryRow");
        if (row.children.length === 0) {
          row.innerHTML = `
          <div class="col-md-3 mb-3" id="cardWaiting"><div class="summary-card"><div class="text-primary"><i class="fas fa-users fa-2x"></i></div><h2>--</h2><small>Currently Waiting</small></div></div>
          <div class="col-md-3 mb-3" id="cardTicketsToday"><div class="summary-card"><div class="text-success"><i class="fas fa-check-circle fa-2x"></i></div><h2>--</h2><small>Tickets Today</small></div></div>
          <div class="col-md-3 mb-3" id="cardAvgService"><div class="summary-card"><div class="text-warning"><i class="fas fa-clock fa-2x"></i></div><h2>--</h2><small>Avg. Service Time</small></div></div>
          <div class="col-md-3 mb-3" id="cardServices"><div class="summary-card"><div class="text-info"><i class="fas fa-list fa-2x"></i></div><h2>--</h2><small>Services</small></div></div>`;
        }

        const now = new Date();
        const todayStart = new Date(
          now.getFullYear(),
          now.getMonth(),
          now.getDate()
        );
        const waitingTotal = tickets.filter(
          (ticket) => (ticket.status || "").toUpperCase() === "WAITING"
        ).length;
        const ticketsToday = tickets.filter((ticket) => {
          const createdAt = ticket.createdAt ? new Date(ticket.createdAt) : null;
          return createdAt && createdAt >= todayStart;
        }).length;
        const completedDurations = tickets
          .filter((ticket) => ticket.calledAt && ticket.completedAt)
          .map(
            (ticket) =>
              (new Date(ticket.completedAt) - new Date(ticket.calledAt)) /
              60000
          )
          .filter((minutes) => Number.isFinite(minutes) && minutes >= 0);
        const avgServiceTime = completedDurations.length
          ? Math.round(
              completedDurations.reduce((sum, minutes) => sum + minutes, 0) /
                completedDurations.length
            )
          : Math.round(
              services.reduce(
                (sum, service) => sum + Number(service.estimatedTime || 0),
                0
              ) / (services.length || 1)
            );
        const activeServices = services.filter(
          (service) => service.isActive !== false
        ).length;

        document.querySelector("#cardWaiting h2").textContent =
          waitingTotal;
        document.querySelector("#cardTicketsToday h2").textContent =
          ticketsToday;
        document.querySelector("#cardAvgService h2").textContent =
          `${avgServiceTime || 0} min`;
        document.querySelector("#cardServices h2").textContent =
          activeServices;
      }

      function updateServiceFilter() {
        const select = document.getElementById("filterService");
        if (!select) return;
        const current = select.value;
        select.innerHTML =
          `<option value="">All Services</option>` +
          services
            .map(
              (s) =>
                `<option value="${escapeHtml(s.id)}">${escapeHtml(s.name)}</option>`
            )
            .join("");
        select.value = [...select.options].some((option) => option.value === current)
          ? current
          : "";
      }

      function renderTickets(ticketList) {
        const tbody = document.getElementById("ticketTableBody");
        if (!ticketList || ticketList.length === 0) {
          tbody.innerHTML = `<tr><td colspan="8" class="text-center py-4">No tickets match the current filters</td></tr>`;
          return;
        }
        tbody.innerHTML = ticketList
          .map(
            (t) => `
        <tr>
          <td>${escapeHtml(t.user?.name ?? "--")}</td>
          <td>${escapeHtml(t.user?.studentCode ?? "--")}</td>
          <td>${escapeHtml(getTicketServiceName(t))}</td>
          <td>${t.position ?? "--"}</td>
          <td><span class="badge bg-${statusColor(t.status)}">${
              escapeHtml(formatStatus(t.status))
            }</span></td>
          <td>${formatTime(t.createdAt)}</td>
          <td>${formatTime(t.calledAt)}</td>
          <td>${formatTime(t.completedAt)}</td>
        </tr>
      `
          )
          .join("");
      }

      function statusColor(status) {
        switch ((status || "").toUpperCase()) {
          case "WAITING":
            return "secondary";
          case "CALLED":
            return "primary";
          case "IN_PROGRESS":
            return "info";
          case "COMPLETED":
            return "success";
          case "CANCELLED":
            return "danger";
          default:
            return "light";
        }
      }

      function formatTime(time) {
        return time ? new Date(time).toLocaleString() : "--";
      }

      function formatStatus(status) {
        return (status || "--").replace(/_/g, " ");
      }

      function getTicketServiceName(ticket) {
        return (
          ticket.service?.name ||
          services.find((service) => service.id === ticket.serviceId)?.name ||
          ticket.serviceId ||
          "--"
        );
      }

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function filterTickets() {
        const serviceId = document.getElementById("filterService")?.value || "";
        const status = document.getElementById("filterStatus")?.value || "";
        const search = (
          document.getElementById("filterSearch")?.value || ""
        )
          .trim()
          .toLowerCase();

        filteredTickets = tickets.filter((ticket) => {
          const matchesService = !serviceId || ticket.serviceId === serviceId;
          const matchesStatus =
            !status || (ticket.status || "").toUpperCase() === status;
          const haystack = [
            ticket.user?.name,
            ticket.user?.studentCode,
            ticket.user?.course,
            ticket.user?.phone,
            getTicketServiceName(ticket),
            ticket.status,
            ticket.position,
          ]
            .filter((value) => value !== undefined && value !== null)
            .join(" ")
            .toLowerCase();

          return (
            matchesService &&
            matchesStatus &&
            (!search || haystack.includes(search))
          );
        });

        renderTickets(filteredTickets);
      }
      async function refreshData() {
        await loadDashboardData();
      }

      // ====== CREATE ADMIN PAGE ======
      function showCreateAdmin() {
        document.getElementById("mainContent").innerHTML = `
        <h2>Create Admin</h2>
        <form id="createAdminForm" class="mt-3">
          <div class="mb-3">
            <label class="form-label">Name</label>
            <input type="text" class="form-control" name="name" required/>
          </div>
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" name="email" required/>
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" name="password" required/>
          </div>
          <button type="submit" class="btn btn-primary">Create Admin</button>
        </form>
        <div id="createAdminAlert" class="mt-3"></div>
      `;

        document
          .getElementById("createAdminForm")
          .addEventListener("submit", async (e) => {
            e.preventDefault();
            const form = e.target;
            const data = {
              name: form.name.value,
              email: form.email.value,
              password: form.password.value,
            };
            try {
              const res = await fetch(`${BASE_URL}/api/auth/admin-register`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                credentials: "include",
                body: JSON.stringify(data),
              });
              const result = await res.json();
              if (res.ok) {
                // Success alert
                document.getElementById(
                  "createAdminAlert"
                ).innerHTML = `<div class="alert alert-success">
          ${result.message || "Admin created!"} <br/>
          <strong>Admin Code:</strong> ${result.adminCode || ""}
        </div>`;
                form.reset();
              } else {
                // Error alert
                document.getElementById(
                  "createAdminAlert"
                ).innerHTML = `<div class="alert alert-danger">
          Failed to create admin: ${result.message || "Unknown error"}
        </div>`;
              }
            } catch (err) {
              document.getElementById(
                "createAdminAlert"
              ).innerHTML = `<div class="alert alert-danger">
        Network or server error: ${err.message}
      </div>`;
            }
          });
      }

      function showCreateClerk() {
        document.getElementById("mainContent").innerHTML = `
    <h2>Create Clerk</h2>
    <form id="createClerkForm" class="mt-3">
      <div class="mb-3">
        <label class="form-label">Name</label>
        <input type="text" class="form-control" name="name" required/>
      </div>
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" name="email" required/>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" class="form-control" name="password" required/>
      </div>
      <div class="mb-3">
        <label class="form-label">Service</label>
        <select class="form-select" name="serviceId" id="clerkServiceSelect" required>
          <option value="">Select Service</option>
        </select>
      </div>
      <button type="submit" class="btn btn-primary">Create Clerk</button>
    </form>
    <div id="createClerkAlert" class="mt-3"></div>
  `;

        loadClerkServices();

        document
          .getElementById("createClerkForm")
          .addEventListener("submit", async (e) => {
            e.preventDefault();
            const form = e.target;
            const data = {
              name: form.name.value,
              email: form.email.value,
              password: form.password.value,
              serviceId: form.serviceId.value,
            };

            try {
              const res = await fetch(`${BASE_URL}/api/auth/clerk/register`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                credentials: "include",
                body: JSON.stringify(data),
              });

              const result = await res.json();

              if (res.ok) {
                document.getElementById(
                  "createClerkAlert"
                ).innerHTML = `<div class="alert alert-success">
            ${result.message || "Clerk created successfully!"}
          </div>`;
                form.reset();
              } else {
                document.getElementById(
                  "createClerkAlert"
                ).innerHTML = `<div class="alert alert-danger">
            Failed to create clerk: ${result.message || "Unknown error"}
          </div>`;
              }
            } catch (err) {
              document.getElementById(
                "createClerkAlert"
              ).innerHTML = `<div class="alert alert-danger">
          Network or server error: ${err.message}
        </div>`;
            }
          });
      }

      // Load services for the select dropdown
      async function loadClerkServices() {
        try {
          const res = await fetch(`${BASE_URL}/api/queue/services/detailed`, {
            credentials: "include",
          });
          const services = (await res.json()).services || [];
          const select = document.getElementById("clerkServiceSelect");
          select.innerHTML =
            `<option value="">Select Service</option>` +
            services
              .map((s) => `<option value="${s.id}">${s.name}</option>`)
              .join("");
        } catch (err) {
          console.error("Failed to load services:", err);
        }
      }

      // ====== STUDENTS PAGE ======
      async function showStudents() {
        document.getElementById("mainContent").innerHTML = `
    <h2>Students</h2>
    <div id="studentsContainer" class="mt-3">Loading...</div>
  `;

        try {
          const res = await fetch(`${BASE_URL}/api/auth/users`, {
            credentials: "include",
          });
          const data = await res.json();
          const students = data.users || [];

          const html = `
      <table class="table table-hover">
        <thead>
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Student Code</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
          ${students
            .map(
              (s) => `
                <tr>
                  <td>${s.name}</td>
                  <td>${s.email}</td>
                  <td>${s.studentCode}</td>
                  <td>
                    <button class="btn btn-warning btn-sm" onclick="resetPassword('${s.studentCode}')">
                      Reset Password
                    </button>
                  </td>
                </tr>`
            )
            .join("")}
        </tbody>
      </table>`;

          document.getElementById("studentsContainer").innerHTML = html;
        } catch (err) {
          document.getElementById("studentsContainer").innerHTML = `
      <div class="alert alert-danger">Failed to load students: ${err.message}</div>
    `;
        }
      }

      function showReports() {
        document.getElementById("mainContent").innerHTML = `
    <h2><i class="fas fa-chart-line me-2"></i> Monthly Reports</h2>

    <div class="row mt-3">
      <div class="col-md-3">
        <label class="form-label">Month</label>
        <select id="reportMonth" class="form-select">
          ${Array.from(
            { length: 12 },
            (_, i) =>
              `<option value="${i + 1}">${new Date(0, i).toLocaleString("en", {
                month: "long",
              })}</option>`
          ).join("")}
        </select>
      </div>

      <div class="col-md-3">
        <label class="form-label">Year</label>
        <select id="reportYear" class="form-select">
          ${[2024, 2025, 2026]
            .map((y) => `<option value="${y}">${y}</option>`)
            .join("")}
        </select>
      </div>

      <div class="col-md-3 d-flex align-items-end">
        <button class="btn btn-primary w-100" onclick="loadMonthlyReport()">
          <i class="fas fa-search"></i> Generate Report
        </button>
      </div>
    </div>

    <div class="card mt-4 shadow-sm">
  <div class="card-header bg-white">
    <h5 class="mb-0"><i class="fas fa-table me-2"></i> Report Results</h5>
  </div>
  <div class="card-body p-0">
    <div class="table-responsive">
      <table class="table table-hover mb-0">
        <thead>
          <tr>
            <th>Service Name</th>
            <th>Clerk Name</th>
            <th>Total Attended</th>
          </tr>
        </thead>
        <tbody id="reportTableBody">
          <tr><td colspan="3" class="text-center py-4">Select a month to view data</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>`;
      }

      async function loadMonthlyReport() {
        const month = document.getElementById("reportMonth").value;
        const year = document.getElementById("reportYear").value;

        let query = "";
        if (month && year) query = `?month=${month}&year=${year}`;

        const res = await fetch(
          `${BASE_URL}/api/admin/reports/monthly${query}`,
          {
            credentials: "include",
          }
        );

        const tbody = document.getElementById("reportTableBody");
        tbody.innerHTML = `<tr><td colspan="3" class="text-center py-4">Loading...</td></tr>`;

        try {
          const res = await fetch(
            `${BASE_URL}/api/admin/reports/monthly?month=${month}&year=${year}`,
            { credentials: "include" }
          );
          const data = await res.json();

          if (!data.success) {
            tbody.innerHTML = `<tr><td colspan="3" class="text-center text-danger py-4">${data.message}</td></tr>`;
            return;
          }

          if (data.data.length === 0) {
            tbody.innerHTML = `<tr><td colspan="3" class="text-center py-4">No data for this period.</td></tr>`;
            return;
          }

          // Build nested rows: service -> clerks
          let rows = "";
          data.data.forEach((service) => {
            const clerkCount = service.clerks?.length || 0;
            if (clerkCount === 0) {
              rows += `
          <tr>
            <td>${service.serviceName}</td>
            <td>--</td>
            <td>0</td>
          </tr>`;
            } else {
              service.clerks.forEach((clerk, index) => {
                rows += `
            <tr>
              ${
                index === 0
                  ? `<td rowspan="${clerkCount}">${service.serviceName}</td>`
                  : ""
              }
              <td>${clerk.clerkName}</td>
              <td>${clerk.totalAttended}</td>
            </tr>`;
              });
            }
          });

          tbody.innerHTML = rows;
        } catch (err) {
          tbody.innerHTML = `<tr><td colspan="3" class="text-center text-danger py-4">
      Error: ${err.message}
    </td></tr>`;
        }
      }

      async function resetPassword(studentCode) {
        if (!confirm("Are you sure you want to reset this student's password?"))
          return;

        try {
          console.log("Calling resetPassword for", studentCode);

          const res = await fetch(
            `${BASE_URL}/api/auth/reset-student-password`,
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              credentials: "include",
              body: JSON.stringify({ studentCode }),
            }
          );

          const data = await res.json();

          if (res.ok) {
            const temporaryPassword =
              data.temporaryPassword || data.data?.temporaryPassword;

            if (!temporaryPassword) {
              alert(
                "Password reset successfully, but the server did not return the temporary password. Please try again after the backend is redeployed."
              );
              return;
            }

            showTemporaryPasswordModal(temporaryPassword);
          } else {
            alert(
              `Failed to reset password: ${data.message || "Unknown error"}`
            );
          }
        } catch (err) {
          alert(`Error: ${err.message}`);
        }
      }

      function showTemporaryPasswordModal(temporaryPassword) {
        let modalEl = document.getElementById("temporaryPasswordModal");

        if (!modalEl) {
          document.body.insertAdjacentHTML(
            "beforeend",
            `
            <div class="modal fade" id="temporaryPasswordModal" tabindex="-1" aria-hidden="true">
              <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                  <div class="modal-header bg-warning">
                    <h5 class="modal-title">
                      <i class="fas fa-key me-2"></i>Temporary Password
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                  </div>
                  <div class="modal-body">
                    <p class="mb-3">Give this temporary password to the student. They must change it after logging in.</p>
                    <label for="temporaryPasswordValue" class="form-label">Temporary password</label>
                    <div class="input-group">
                      <input
                        type="text"
                        class="form-control"
                        id="temporaryPasswordValue"
                        readonly
                      />
                      <button
                        class="btn btn-outline-primary"
                        type="button"
                        id="copyTemporaryPasswordBtn"
                      >
                        <i class="fas fa-copy me-2"></i>Copy
                      </button>
                    </div>
                    <div class="small text-success mt-2 d-none" id="copyTemporaryPasswordStatus">
                      Copied to clipboard
                    </div>
                  </div>
                  <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                  </div>
                </div>
              </div>
            </div>`
          );

          modalEl = document.getElementById("temporaryPasswordModal");
          document
            .getElementById("copyTemporaryPasswordBtn")
            .addEventListener("click", copyTemporaryPassword);
        }

        const passwordInput = document.getElementById("temporaryPasswordValue");
        const copyStatus = document.getElementById("copyTemporaryPasswordStatus");
        passwordInput.value = temporaryPassword;
        copyStatus.classList.add("d-none");

        new bootstrap.Modal(modalEl).show();
      }

      async function copyTemporaryPassword() {
        const passwordInput = document.getElementById("temporaryPasswordValue");
        const copyStatus = document.getElementById("copyTemporaryPasswordStatus");

        try {
          await navigator.clipboard.writeText(passwordInput.value);
        } catch (err) {
          passwordInput.select();
          document.execCommand("copy");
          passwordInput.blur();
        }

        copyStatus.classList.remove("d-none");
      }

      function logout() {
        fetch(`${BASE_URL}/api/auth/logout`, {
          method: "POST",
          credentials: "include",
        }).finally(() => (window.location.href = "./adminLogin.html"));
      }
    </script>
  </body>
</html>
